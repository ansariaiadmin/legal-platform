name: Bug report
description: Something is broken or behaves against the specification
title: '[bug] '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        `docs/SPEC.md` is the single source of truth. If the behaviour contradicts it, quote the section.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      placeholder: A short, factual description of the wrong behaviour.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: The correct behaviour, with the SPEC section if it is specified there.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up --build
        2. curl -X POST http://localhost:8080/api/auth/otp/request -d '{"phone":"..."}'
        3. ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Exact command output, HTTP status and response body, or `docker compose logs` excerpt.
      render: text
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - apps/api
        - apps/web
        - packages
        - infra / docker
        - scripts / ops
        - database migrations
        - documentation
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - blocker - the platform does not start or data is at risk
        - high - a core flow is broken
        - medium - a feature misbehaves but a workaround exists
        - low - cosmetic or minor
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This report involves credentials, encryption, or client data. If so, do not attach real secrets.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS / Ubuntu version, Docker version, git commit, NODE_ENV
      render: text
    validations:
      required: true
