name: CI

on:
  push:
    branches: [main, master, arena/01a070f0-legal-platform]

permissions:
  contents: write
  checks: write
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Build Web
        run: npm run build --workspace=apps/web

      - name: Python worker tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pytest suite
        run: |
          python -m pip install -q pytest
          cd apps/workers/py && python -m pytest -q

      - name: Dependency audit gate (advisory — majors are tracked debt, do not hard-fail yet)
        run: npm audit --omit=dev --audit-level=high || echo "::warning::high-severity advisories remain — tracked as Phase 12 dependency-lift"
        continue-on-error: true

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legal
          POSTGRES_PASSWORD: ci-legal-password
          POSTGRES_DB: legal_platform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U legal" --health-interval 5s
          --health-timeout 5s --health-retries 12

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages (agents + shared types needed by API/Migrations)
        run: npm run build:packages

      - name: "Run migrations (idempotency proof: up, then down:all, then up again)"
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://legal:ci-legal-password@localhost:5432/legal_platform_test
        run: |
          set -x
          node -v
          npx node-pg-migrate --version
          node -e "
            const { Client } = require('pg');
            const c = new Client(process.env.DATABASE_URL);
            c.connect().then(() => c.query('SELECT 1 AS ok')).then(() => c.end()).then(() => console.log('DB-CONNECT-OK'));
          "
          npm run migrate:up
          npm run migrate:down:all
          npm run migrate:up

      - name: E2E integration suite (auth full flow + wallet ledger on REAL Postgres)
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://legal:ci-legal-password@127.0.0.1:5432/legal_platform_test
          JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-00
          JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret00
          NODE_ENV: test
        run: npm run test:e2e -- --forceExit

      - name: Install pg client matching server version (pg16) — pg_dump REFUSES server newer than itself
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          psql --version && pg_dump --version && pg_restore --version

      - name: "Drill A — seed + backup via scripts/backup.sh"
        id: drill_backup
        env:
          DATABASE_URL: postgresql://legal:ci-legal-password@127.0.0.1:5432/legal_platform_test
          POSTGRES_PASSWORD: ci-legal-password
        run: |
          set -o pipefail
          {
            psql "$DATABASE_URL" -c "INSERT INTO users (id, phone_normalized, display_name, status, created_at, updated_at) VALUES ('11111111-1111-1111-1111-111111111111','09120000000','ci-backup-drill-seed','active', now(), now()) ON CONFLICT DO NOTHING;"
            SEED_COUNT=$(psql -tA "$DATABASE_URL" -c "SELECT count(*) FROM users WHERE phone_normalized='09120000000'" | tr -d '[:space:]')
            echo "seed_count=$SEED_COUNT"
            [ "$SEED_COUNT" -ge 1 ] || { echo "seed failed"; exit 1; }
            bash ./scripts/backup.sh
            BACKUP_FILE=$(ls -t backups/backup-*.tar.gz | head -1)
            echo "backup_file=$BACKUP_FILE"
            [ -n "$BACKUP_FILE" ] || exit 1
            tar -tzf "$BACKUP_FILE"
            echo "backup_file=$BACKUP_FILE" >> $GITHUB_OUTPUT
          } 2>&1 | tee /tmp/drillA.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "### Drill A FAILED (seed/backup)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 /tmp/drillA.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit $rc
          fi

      - name: "Drill B — restore into FRESH database via scripts/restore.sh"
        env:
          DATABASE_URL: postgresql://legal:ci-legal-password@127.0.0.1:5432/legal_platform_test
          POSTGRES_PASSWORD: ci-legal-password
        run: |
          set -o pipefail
          {
            BACKUP_FILE="${{ steps.drill_backup.outputs.backup_file }}"
            echo "using backup=$BACKUP_FILE"
            psql "postgresql://legal:ci-legal-password@127.0.0.1:5432/postgres" -c "DROP DATABASE IF EXISTS legal_platform_restored;"
            psql "postgresql://legal:ci-legal-password@127.0.0.1:5432/postgres" -c "CREATE DATABASE legal_platform_restored;"
            RESTORE_URL=postgresql://legal:ci-legal-password@127.0.0.1:5432/legal_platform_restored
            DATABASE_URL="$RESTORE_URL" bash ./scripts/restore.sh --confirm "$BACKUP_FILE"
          } 2>&1 | tee /tmp/drillB.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            # Channel discipline: artifacts/logs are Azure-CDN-hosted and unreachable
            # from our sandbox; repo commit-comments go through api.github.com.
            head -c 800 /tmp/drillB.log > /tmp/drillB.head || true
            tail -c 8000 /tmp/drillB.log > /tmp/drillB.tail || true
            { echo "CI drill-B FAILED:"; echo '```'; cat /tmp/drillB.head; echo "…"; cat /tmp/drillB.tail; echo '```'; } > /tmp/drillBody.md
            jq -Rs '{body: .}' < /tmp/drillBody.md > /tmp/drillBody.json
            GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -X POST --input /tmp/drillBody.json --jq .html_url || { echo "::warning::comment channel failed — dumping inline instead"; cat /tmp/drillBody.md; }
            echo "===DRILL-B-LOG-END==="
            exit $rc
          fi

      - name: Upload drill logs as artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drill-logs
          path: |
            /tmp/drillA.log
            /tmp/drillB.log
          if-no-files-found: ignore
          retention-days: 3

      - name: "Drill C — verify the seed row survived the hard round-trip"
        run: |
          RESTORE_URL=postgresql://legal:ci-legal-password@127.0.0.1:5432/legal_platform_restored
          CLONE_COUNT=$(psql -tA "$RESTORE_URL" -c "SELECT count(*) FROM users WHERE phone_normalized='09120000000'" | tr -d '[:space:]')
          {
            echo "## Backup/Restore drill result"
            echo "- seed in restored db: \`$CLONE_COUNT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$CLONE_COUNT" -ge 1 ] || { echo "RESTORE DRILL FAILED — seed absent in clone (count='$CLONE_COUNT')"; exit 1; }
          echo "BACKUP/RESTORE DRILL PASSED: row survived hard round-trip"

      - name: Preflight must say FAIL in production-hygiene mode with missing secrets
        working-directory: apps/api
        env:
          NODE_ENV: production
          DEV_DASHBOARD_TOKEN: should-fail-the-gate
        run: |
          set +e
          npx ts-node src/preflight.ts
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then echo "PREFLIGHT SHOULD HAVE FAILED"; exit 1; fi
          echo "preflight failed honestly ✓ (exit $rc)"
