# Legal Platform — single-host stack (used by `sudo ./setup.sh`).
#
# Every service reads its configuration from `.env` (created by the installer
# from `.env.example`). Only the reverse proxy is published, and only on
# 127.0.0.1:8080 — put your own TLS proxy in front of it, or use
# docker-compose.prod.yml for a hardened public deployment.
services:
  proxy:
    image: nginx:alpine
    container_name: legal-proxy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
      - client
    restart: unless-stopped
    networks:
      - legal-network

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: legal-web
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - API_URL=http://api:3001
      - API_PROXY_TARGET=http://api:3001
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - legal-network

  # Client portal, served by the proxy under /portal.
  client:
    build:
      context: .
      dockerfile: infra/docker/client.Dockerfile
    container_name: legal-client
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - legal-network

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: legal-api
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3001
      - LOCAL_STORAGE_PATH=${LOCAL_STORAGE_PATH:-/app/uploads}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - legal-network

  # Python sidecar for deterministic text processing (normalisation, chunking,
  # citation extraction). Standard-library only: no pip dependencies.
  workers-py:
    build:
      context: .
      dockerfile: infra/docker/workers.Dockerfile
    container_name: legal-workers-py
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - legal-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: legal-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-legal}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-legal_password_change_me}
      - POSTGRES_DB=${POSTGRES_DB:-legal_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legal} -d ${POSTGRES_DB:-legal_platform}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - legal-network

  redis:
    image: redis:7-alpine
    container_name: legal-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - legal-network

  # ZarinPal-compatible payment stub for smoke tests and CI. Opt-in only:
  #   docker compose --profile mock-gateways up mock-zarinpal
  # Then set PAYMENT_PROVIDER=zarinpal and
  # ZARINPAL_BASE_URL=http://mock-zarinpal:8085/pg/v4/payment to exercise the
  # full request → verify → credit loop without real money.
  mock-zarinpal:
    image: node:22-alpine
    profiles: [mock-gateways]
    working_dir: /srv
    command: ["node", "scripts/mock-gateway/zarinpal-stub.server.mjs"]
    environment:
      PORT: "8085"
    volumes:
      - .:/srv:ro
    ports:
      - "127.0.0.1:8085:8085"
    networks:
      - legal-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8085/health"]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  legal-network:
    driver: bridge
